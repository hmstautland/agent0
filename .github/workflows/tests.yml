name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this job name stable: it is the status check to mark as required in
  # the master branch protection rule (Settings -> Branches).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # libportaudio2: sounddevice needs it at import time.
      # xvfb: pynput refuses to import without an X display.
      # ffmpeg: the format-conversion tests run the real encoder.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 xvfb ffmpeg

      # The CPU-only torch index avoids pulling ~GBs of CUDA libraries; the
      # tests never run Kokoro itself, they only need the package importable.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # core/speech_to_text.py loads the Whisper "base" model at import time,
      # which downloads it from Hugging Face - cache it between runs.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-whisper-base

      - name: Run tests
        run: xvfb-run -a python -m pytest -q
